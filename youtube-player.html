<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Class Whiteboard · video player</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}p{color:#fff;font:16px sans-serif;text-align:center;margin-top:40vh}</style>
</head><body>
<script>
// Class Whiteboard video player. Put this file on any website (for example GitHub Pages) and give its address to the
// whiteboard (Web & video › Videos when the board is opened as a file). YouTube only plays a video inside another page
// when it is told which website shows it; a board opened as a file can't say, but this page can.
const q = new URLSearchParams(location.search), id = (q.get('v') || '').replace(/[^\w-]/g, ''), start = parseInt(q.get('start') || '0', 10) || 0;
if (!id) document.body.innerHTML = '<p>Class Whiteboard video player: no video was given.</p>';
else {
  const f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&playsinline=1' + (start ? '&start=' + start : '');
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true; f.title = 'YouTube video';
  document.body.append(f);
}
</script>
</body></html>
